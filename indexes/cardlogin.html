<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/style/cardlogin.css">
    <link rel="shortcut icon" href="../src/imagens/logo2.png" type="image/x-icon">

    <title>login</title>
</head>
<body>
    <!-- Corrigido: 'login' transformado em um ID ou classe -->
    <section id="login-section">
        <div class="card">
            <div class="inf">
                <img class="imgsocial" src="../src/imagens/usuario-img.jpg" alt="usuario"> 
                <h1>Bem vindo ao GIE</h1>  
            </div>

            <!-- Corrigido: Removido o formulário duplicado que envolvia o card -->
            <form id="meu-formulario"> 
                <div class="labelg"> 
                    <label></label>
                    <!-- Corrigido: Adicionado id="email" para o JS conseguir encontrar o campo -->
                    <input type="email" id="email" name="email" placeholder="email" required>
                </div>

                <div class="labelg">
                    <label></label>
                    <!-- Corrigido: Adicionado id="senha" para o JS conseguir encontrar o campo -->
                    <input type="password" id="senha" name="senha" placeholder="senha" required>
                </div>

                <div class="label">
                    <label><input type="checkbox">lembrar senha</label>
                </div>

                <div class="botaoentrar">
                    <!-- Corrigido: A tag <acessar> não existe no HTML, deixado apenas o texto -->
                    <button type="submit">entrar</button>
                </div>
            </form>

            <!-- Area do script -->
            <script src="card.js"></script> <!-- validaçao de usuario-->
            <script src="login-background-img.js"></script> <!-- muda as imagens de fundo sempre que recarregado-->
        </div>
    </section> 
</body>
</html>
