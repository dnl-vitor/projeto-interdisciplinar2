<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/style/cardlogin.css">
    <link rel="shortcut icon" href="../src/imagens/logo2.png" type="image/x-icon">

    <title>login</title>
</head>
<body>
    <section id="login-section">
        <div class="card">
            <div class="inf">
                <img class="imgsocial" src="../src/imagens/usuario-img.jpg" alt="usuario">
                <h1>Bem vindo ao GIE</h1>
            </div>

            <form id="meu-formulario" action="login.php" method="POST">
                <div class="labelg">
                    <label></label>
                    <input type="email" id="email" name="email" placeholder="email" required>
                </div>

                <div class="labelg">
                    <label></label>
                    <input type="password" id="senha" name="senha" placeholder="senha" required>
                </div>

                <p id="mensagem" style="color:#ff7b7b; font-size:14px; min-height:18px; text-align:center;"></p>

                <div class="label">
                    <label><input type="checkbox">lembrar senha</label>
                </div>

                <div class="botaoentrar">
                    <button type="submit">entrar</button>
                </div>

                <div style="text-align: center;">
                    <a href="index_cadastro.html" style="color:#ffffff;">criar conta</a>
                </div>
            </form>

            <script src="login-background-img.js"></script>
        </div>
    </section>
    <script>
        if (new URLSearchParams(window.location.search).get('erro') === '1') {
            document.getElementById('mensagem').textContent = 'Email ou senha incorretos.';
        }
    </script>
</body>
</html>

<script src="../indexes/temas.js"></script>
